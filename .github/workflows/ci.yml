name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Swift tests
        run: swift test
      - name: play-sound tests
        run: tests/test-play-sound.sh
      - name: App bundle
        run: ./build.sh
