name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The Liquid Glass helpers in Theme.swift need the macOS 26 SDK (Xcode 26).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Build
        run: swift build
      - name: Swift tests
        run: swift test
      - name: play-sound tests
        run: tests/test-play-sound.sh
      - name: App bundle
        run: ./build.sh
